# Linear states move only through the canon's handler (keeminlee/starforge-linear-handler), pinned by commit: the
# same SHA on both lines below. pull_request_target so a fork's PR is seen too; the handler never runs PR code, and
# acts only for our own authors.
name: linear-handler
on:
  pull_request_target:
    types: [opened, ready_for_review, converted_to_draft, edited, closed]
concurrency:
  group: linear-handler-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  linear:
    uses: keeminlee/starforge-linear-handler/.github/workflows/linear-handler.yml@HANDLER_SHA
    with:
      handler-ref: HANDLER_SHA
    secrets:
      LINEAR_APP: ${{ secrets.LINEAR_HANDLER_APP }}
